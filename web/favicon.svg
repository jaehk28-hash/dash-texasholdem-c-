<!-- tools/make-icons.mjs가 만든 파일. 직접 고치지 말고 logo.svg를 고친 뒤 다시 실행 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 100 310 310" width="64" height="64" style="display:block;--coupe-w:22px;--coupe-bubbles:none"><symbol id="coupe" overflow="visible">
