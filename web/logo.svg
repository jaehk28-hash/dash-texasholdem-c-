<?xml version="1.0" encoding="UTF-8"?>
<!-- 쿠페 잔과 스페이드. 잔 그림은 여기 symbol 하나뿐이다 (직접 그린 도형).
     화면은 <use href="/logo.svg?v=2#coupe">로 이 symbol을 가져다 쓴다.
     favicon.svg와 PNG들은 tools/make-icons.mjs가 이 symbol로 다시 만든다.
     크기에 맞춘 보정: 쓰는 쪽에서 coupe-w(선 두께), coupe-bubbles(기포 표시) CSS 변수를 정한다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 62 300 387" width="150" height="193.5" role="img" aria-label="Coupe Holdem 로고">
  <symbol id="coupe" overflow="visible">
    <g fill="none" stroke="#e8c56b" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: var(--coupe-w, 7px)">
      <!-- 넓고 얕은 보울과 윗변 -->
      <path d="M120 140C120 220 180 262 220 262C260 262 320 220 320 140"/>
      <ellipse cx="220" cy="140" rx="100" ry="14"/>
      <!-- 가늘고 곧은 줄기와 납작한 받침 -->
      <path d="M220 262V372"/>
      <ellipse cx="220" cy="374" rx="58" ry="10"/>
      <!-- 기포 -->
      <g style="display: var(--coupe-bubbles, inline)">
        <circle cx="163" cy="186" r="7"/>
        <circle cx="277" cy="180" r="5"/>
        <circle cx="270" cy="212" r="3.500"/>
      </g>
    </g>
    <!-- 잔 속에 담긴 스페이드 (윗변 아래에 머문다) -->
    <path id="coupe-spade" style="display: var(--coupe-spade, inline)" transform="translate(218 205) rotate(-14) scale(2)" fill="#ff4f8b" d="M0-18C5-10 16-5 16 4C16 10 11 13 6.500 12C4.500 11.500 2.800 10.500 1.600 9C2.200 13 3.800 16.500 6.500 18.500L-6.500 18.500C-3.800 16.500-2.200 13-1.600 9C-2.800 10.500-4.500 11.500-6.500 12C-11 13-16 10-16 4C-16-5-5-10 0-18Z"/>
  </symbol>
  <use href="#coupe"/>
</svg>
